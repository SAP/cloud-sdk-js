name: memory-tests

on:
  workflow_dispatch:
  schedule:
    - cron: 0 21 * * *

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - name: start e2e tests server
        run: pnpm --filter @sap-cloud-sdk/e2e-tests run pretest:e2e
      - name: install test v2
        working-directory: test-packages/memory-tests/sdk-v2/
        run: pnpm install
      - name: generate v2 test client
        working-directory: test-packages/memory-tests/sdk-v2/
        run: pnpm exec generate-odata-client
      - working-directory: test-packages/memory-tests/sdk-v2/
        run: node --inspect test-script.js && cat result.txt
      - name: install test canary
        working-directory: test-packages/memory-tests/sdk-canary/
        run: pnpm install
      - name: generate canary test client
        working-directory: test-packages/memory-tests/sdk-canary/
        run: pnpm exec generate-odata-client
      - working-directory: test-packages/memory-tests/sdk-canary/
        run: node --inspect test-script.js && cat result.txt
      - name: compare v2 and canary
        run: node scripts/compare-memory-usage.ts "$(cat ./test-packages/memory-tests/sdk-v2/result.txt)" "$(cat ./test-packages/memory-tests/sdk-canary/result.txt)"
